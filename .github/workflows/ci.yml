name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['pa*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same commands as `npm run check` locally. No `|| true`, no continue-on-error.
      - name: lint
        run: npm run lint
      - name: format check
        run: npm run format:check
      - name: type check
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: contract tests
        run: npm run test:contract
      - name: build
        run: npm run build
