name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['pa*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throw-away database that lives only for this job: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: leetkob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/leetkob_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: generate a one-off JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # Same commands as `npm run check` locally. No `|| true`, no continue-on-error.
      - name: lint
        run: npm run lint
      - name: format check
        run: npm run format:check
      - name: type check
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: contract tests
        run: npm run test:contract
      - name: build
        run: npm run build
